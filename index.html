<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ REMOVE.BG | الأداة الأسطورية</title>
    <style>
        /* إعدادات وتصفير الأبعاد */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* خلفية سينمائية متحركة مستوحاة من عوالم السايبربانك */
        body {
            background: linear-gradient(125deg, #0f0f13, #151522, #1a0b2e, #081629);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* تصميم الحاوية الزجاجية الاحترافية - Glassmorphism */
        .cyber-container {
            background: rgba(20, 20, 30, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        0 0 40px rgba(0, 173, 181, 0.1);
            text-align: center;
            max-width: 550px;
            width: 100%;
            position: relative;
        }

        /* عنوان أسطوري متوهج */
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #00fff2, #00adb5, #9d4edd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 255, 242, 0.2);
        }

        p.subtitle {
            color: #8b8ba7;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* مربع رفع الصور النيون السحري */
        .upload-zone {
            border: 2px dashed rgba(0, 255, 242, 0.3);
            background: rgba(0, 0, 0, 0.2);
            padding: 40px 20px;
            border-radius: 16px;
            cursor: pointer;
            margin-bottom: 25px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: block;
            position: relative;
            overflow: hidden;
        }

        .upload-zone:hover {
            border-color: #00fff2;
            background: rgba(0, 255, 242, 0.04);
            box-shadow: 0 0 25px rgba(0, 255, 242, 0.15);
            transform: scale(1.02);
        }

        .upload-zone svg {
            fill: #00adb5;
            width: 55px;
            height: 55px;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .upload-zone:hover svg {
            transform: translateY(-5px);
            fill: #00fff2;
        }

        .upload-text-main {
            font-size: 16px;
            font-weight: 600;
            color: #e2e2ec;
            margin-bottom: 5px;
        }

        .upload-text-sub {
            font-size: 12px;
            color: #6c6c8a;
        }

        input[type="file"] {
            display: none;
        }

        /* زر الإطلاق التكنولوجي المشع */
        .neon-btn {
            background: linear-gradient(135deg, #00adb5, #00fff2);
            color: #0d0d13;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 242, 0.3);
            letter-spacing: 0.5px;
        }

        .neon-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #00fff2, #00adb5);
            box-shadow: 0 0 30px rgba(0, 255, 242, 0.6);
            transform: translateY(-2px);
        }

        .neon-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .neon-btn:disabled {
            background: #252533;
            color: #55556b;
            box-shadow: none;
            cursor: not-allowed;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* حالة المعالجة والـ Status */
        .status-message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
            color: #ffb703;
            min-height: 20px;
        }

        /* لوحة عرض النتيجة الأسطورية */
        #resultContainer {
            margin-top: 30px;
            display: none;
            animation: fadeInUp 0.6s ease forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .preview-wrapper {
            background: #111116;
            padding: 15px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            display: inline-block;
            max-width: 100%;
            position: relative;
        }

        /* شبكة الشفافية الاحترافية للـ PNG خلف الصورة */
        #outputImage {
            max-width: 100%;
            max-height: 350px;
            border-radius: 10px;
            background-image: linear-gradient(45deg, #202026 25%, transparent 25%), 
                              linear-gradient(-45deg, #202026 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #202026 75%), 
                              linear-gradient(-45deg, transparent 75%, #202026 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            background-color: #18181f;
        }

        /* زر التحميل الأخضر المتوهج */
        .download-btn {
            display: block;
            margin-top: 20px;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.3);
        }

        .download-btn:hover {
            box-shadow: 0 0 25px rgba(0, 180, 216, 0.5);
            transform: translateY(-2px);
            background: linear-gradient(135deg, #0077b6, #00b4d8);
        }
    </style>
</head>
<body>

<div class="cyber-container">
    <h1>CYBER REMOVER</h1>
    <p class="subtitle">امسح خلفية أي صورة بدقة الذكاء الاصطناعي الخارقة</p>
    
    <!-- منطقة السحب والإفلات وتحديد الملف -->
    <label class="upload-zone" id="dropArea">
        <!-- أيقونة برمجية عصرية -->
        <svg viewBox="0 0 24 24">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
        </svg>
        <div class="upload-text-main" id="mainText">اختر ملف صورة أو اسحبه هنا</div>
        <div class="upload-text-sub">يدعم صيغ PNG, JPG بحجم احترافي</div>
        <input type="file" id="imageInput" accept="image/*">
    </label>

    <!-- زر المعالجة -->
    <button class="neon-btn" id="launchBtn" disabled>إطلاق المعالجة الذكية ⚡</button>
    
    <!-- رسائل الحالة -->
    <div class="status-message" id="statusText"></div>

    <!-- حاوية النتيجة -->
    <div id="resultContainer">
        <div class="preview-wrapper">
            <img id="outputImage" src="" alt="النتيجة الشفافة">
        </div>
        <a id="downloadLink" class="download-btn" download="cyber_remover_no_bg.png">تحميل النسخة الشفافة 🌌</a>
    </div>
</div>

<script>
    // 🔴 حط الـ API KEY الجديد السري بتاعك هنا بين علامات التنصيص
    const API_KEY = "RRfr3nr5Psg6Y9DFb82yLCXY";

    const imageInput = document.getElementById('imageInput');
    const launchBtn = document.getElementById('launchBtn');
    const statusText = document.getElementById('statusText');
    const resultContainer = document.getElementById('resultContainer');
    const outputImage = document.getElementById('outputImage');
    const downloadLink = document.getElementById('downloadLink');
    const mainText = document.getElementById('mainText');
    const dropArea = document.getElementById('dropArea');

    // تفعيل وتغيير شكل النص عند اختيار صورة
    imageInput.addEventListener('change', function() {
        if (this.files && this.files[0]) {
            mainText.innerHTML = `تم التقاط: <span style="color: #00fff2;">${this.files[0].name}</span>`;
            launchBtn.disabled = false;
        }
    });

    // إضافة تأثير السحب والإفلات المرن (Drag and Drop)
    ['dragenter', 'dragover'].forEach(eventName => {
        dropArea.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropArea.style.borderColor = '#00fff2';
            dropArea.style.background = 'rgba(0, 255, 242, 0.08)';
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropArea.style.borderColor = 'rgba(0, 255, 242, 0.3)';
            dropArea.style.background = 'rgba(0, 0, 0, 0.2)';
        }, false);
    });

    dropArea.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length > 0) {
            imageInput.files = files;
            mainText.innerHTML = `تم إسقاط: <span style="color: #00fff2;">${files[0].name}</span>`;
            launchBtn.disabled = false;
        }
    });

    // كود تشغيل الـ API السحري
    launchBtn.addEventListener('click', async () => {
        const file = imageInput.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('image_file', file);
        formData.append('size', 'auto');

        statusText.style.color = '#ffb703';
        statusText.innerText = "جاري تفتيت الخلفية ميكروسكوبياً... 🔮";
        launchBtn.disabled = true;
        resultContainer.style.display = "none";

        try {
            const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                method: 'POST',
                headers: { 'X-Api-Key': API_KEY },
                body: formData
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                
                outputImage.src = url;
                downloadLink.href = url;
                
                statusText.style.color = '#00fff2';
                statusText.innerText = "تمت العملية بنجاح أسطوري! 🚀";
                resultContainer.style.display = "block";
            } else {
                const errData = await response.json();
                statusText.style.color = '#ff4d4d';
                statusText.innerText = "فشل الإطلاق: " + (errData.errors[0].title || "تأكد من الكود أو الباقة.");
            }
        } catch (error) {
            statusText.style.color = '#ff4d4d';
            statusText.innerText = "خطأ في الاتصال بالخادم السيبراني.";
            console.error(error);
        } finally {
            launchBtn.disabled = false;
        }
    });
</script>

</body>
</html>
